<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* =====================================================================
   EDIT HERE. These are the only lines you need to change.
   Keep the quotes. Save the file, then upload it again.
   ===================================================================== */
const SITE = {
  // Spotify song link. Paste it between the quotes when the song is live.
  // In Spotify: open the song, tap ⋯ > Share > Copy Song Link.
  // It looks like "https://open.spotify.com/track/" followed by a long code.
  spotifyUrl: "",

  // Optional: a pre-save link from your distributor, used until spotifyUrl is set.
  presaveUrl: "",

  // Optional: cover art. Put the image next to this file and write its name, e.g. "cover.jpg"
  coverArt: "cover.jpg",

  // Profile picture for the header and the browser tab, next to this file.
  profilePic: "profile.jpg",

  // Background painting, cut into a mosaic behind the page. Put it next to this file.
  background: "background.jpg",

  // Release moment, counted in each visitor's own time zone.
  release: "2026-12-25T00:00",

  instagramUrl: "https://www.instagram.com/goldpiece.24k/"
};
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crevàusse by goldpiece</title>
<meta name="description" content="Crevàusse, the new single from goldpiece. Out on Spotify December 25, 2026.">
<meta property="og:type" content="music.song">
<meta property="og:title" content="Crevàusse by goldpiece">
<meta property="og:description" content="The new single, out on Spotify December 25, 2026.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23e3b649'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%23111'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a release poster for a groovy house / UK garage single, late-night and warm
   IDEA a 12-inch pressing half out of its sleeve, stamped in 24k gold foil
   PICTURE the sleeve with his cover art and the record sliding out, over a mosaic cut from his grey triptych
   COLOUR black and grey mosaic ground, warm white ink, gold foil and a few gold tile edges; red only from the cover
   TYPE Unbounded (wide, Y2K club flyer) + Manrope
   LAYOUT laptop: record left, title, countdown and buttons right; phone: title, record, countdown, buttons */
:root{color-scheme:dark;--bg:#0b0b0c;--ink:#f3efe6;--mute:#b3ada3;--gold:#e3b649;--hi:#fff1b5;--line:rgba(227,182,73,.32);--wine:#17120a;
--foil:linear-gradient(100deg,#9a6c1c 0%,#e8c058 20%,#fff2b3 36%,#dcaa3c 52%,#a97b22 70%,#f2d478 88%,#c0912f 100%)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:inherit}
.band{padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.foiltext{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}

.top{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;min-height:100svh}
/* Background: fragments of his grey triptych laid out as a mosaic, built by the script below. */
.backdrop{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#060606}
.mosaic{position:absolute;inset:-2px;display:grid;gap:3px;grid-auto-flow:dense}
.tile{position:relative;background:#141414 var(--art) no-repeat;transition:opacity 2.6s ease,box-shadow 2.6s ease}
.tile.gold{box-shadow:inset 0 0 0 2px rgba(227,182,73,.9)}
/* A shard lights up under the pointer (or on its own now and then) and dims back slowly. */
.tile::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity 2.6s ease;background:radial-gradient(closest-side,rgba(255,212,112,.42),rgba(255,212,112,0))}
.tile.lit{opacity:1!important;box-shadow:inset 0 0 0 1px rgba(240,200,100,.75);transition-duration:.8s}
.tile.lit::after{opacity:1;transition-duration:.8s}
.backdrop::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,8,9,.26) 0%,rgba(8,8,9,.36) 60%,rgba(8,8,9,.58) 100%)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px}
.mark{display:inline-flex;align-items:center;gap:10px;font:700 19px/1 Unbounded,"Arial Black",sans-serif;letter-spacing:-.01em;text-decoration:none;padding-block:5px}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;object-fit:cover;background:#000;box-shadow:0 0 0 1px var(--line)}

.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"stage head" "stage panel";column-gap:clamp(32px,5vw,88px);row-gap:26px;align-items:center;padding-block:clamp(16px,3vw,48px) clamp(40px,6vw,96px)}
.head{grid-area:head;align-self:end;container-type:inline-size}
.panel{grid-area:panel;align-self:start;padding:clamp(16px,2.4vw,26px);border:1px solid rgba(227,182,73,.24);border-radius:18px;background:rgba(12,12,13,.84)}
h1{margin:0;padding-block:.08em .04em;font:800 clamp(40px,11.5vw,92px)/1.02 Unbounded,"Arial Black",sans-serif;font-size:min(92px,14.4cqi);letter-spacing:-.025em;filter:drop-shadow(0 2px 16px rgba(0,0,0,.85))}

.stage{grid-area:stage;position:relative;width:100%;aspect-ratio:1.42/1}
.sleeve{position:absolute;left:0;top:0;width:70.4%;aspect-ratio:1;z-index:2;overflow:hidden;border-radius:3px;background:#121212;container-type:inline-size;box-shadow:inset 0 0 0 1px rgba(255,236,190,.09),18px 0 26px -12px rgba(0,0,0,.8),0 30px 56px -24px rgba(0,0,0,.85)}
.sleeve img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8cqi}
.art::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 100%,rgba(227,182,73,0) 0 2.6cqi,rgba(227,182,73,.42) 2.75cqi 2.95cqi);-webkit-mask:radial-gradient(circle 62cqi at 100% 100%,#000 98%,transparent 100%);mask:radial-gradient(circle 62cqi at 100% 100%,#000 98%,transparent 100%)}
.art p{position:relative;margin:0}
.art .a1{font:700 5.6cqi/1 Manrope,sans-serif;color:var(--ink)}
.art .a2{margin-top:2.4cqi;font:800 11.4cqi/1.1 Unbounded,"Arial Black",sans-serif;letter-spacing:-.025em}
.art .a3{font:600 4.6cqi/1 Manrope,sans-serif;color:var(--mute)}

.record{position:absolute;left:31.7%;top:3%;width:66.2%;aspect-ratio:1;z-index:1;border-radius:50%;overflow:hidden;box-shadow:0 26px 50px -22px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,230,170,.14)}
.disc{position:absolute;inset:0;border-radius:50%;animation:spin 1.8s linear infinite;will-change:transform;
background:radial-gradient(circle closest-side,transparent 0 35%,#0b0b0c 35.6% 40.5%,transparent 41% 95%,#0b0b0c 95.5% 100%),repeating-radial-gradient(circle closest-side,#0e0e10 0 1px,#1b1b1e 1.6px 2.7px)}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 25deg,transparent 0 5%,rgba(255,226,160,.17) 10%,transparent 16% 50%,rgba(255,226,160,.12) 59%,transparent 66%);-webkit-mask:radial-gradient(circle closest-side,transparent 35%,#000 36%);mask:radial-gradient(circle closest-side,transparent 35%,#000 36%)}
.label{position:absolute;inset:33%;border-radius:50%;container-type:inline-size;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a1a06;text-align:center;background:radial-gradient(circle at 34% 28%,#fff2b3 0%,#e8c058 34%,#b8892c 72%,#8a611a 100%)}
.label span{display:block;line-height:1}
.l1{font:600 11cqi Unbounded,sans-serif}
.hole{width:8cqi;height:8cqi;margin:6cqi 0;border-radius:50%;background:#0e0e10}
.l2{font:800 12.5cqi Unbounded,sans-serif;letter-spacing:-.02em}
.l3{margin-top:4cqi;font:700 7cqi Manrope,sans-serif}
@keyframes spin{to{transform:rotate(360deg)}}

.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line);container-type:inline-size}
.unit{padding:16px 4px 14px;text-align:center;border-left:1px solid var(--line)}
.unit:first-child{border-left:0}
.num{display:block;font:700 clamp(30px,8.6vw,56px)/1 Unbounded,"Arial Black",sans-serif;font-size:clamp(24px,13cqi,56px);color:#f1cf6e;white-space:nowrap}
.num i{display:inline-block;width:.8em;font-style:normal;text-align:center}
.lab{display:block;margin-top:8px;font-size:13px;font-weight:600;color:var(--mute)}
.outnow{margin:0;padding-block:.06em;font:800 clamp(48px,9vw,88px)/1.02 Unbounded,"Arial Black",sans-serif;letter-spacing:-.025em}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{flex:1 1 210px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:999px;font:700 16px/1 Manrope,sans-serif;text-decoration:none;white-space:nowrap;transition:filter .15s,border-color .15s}
.btn svg{width:22px;height:22px;flex:none}
.spot{background:var(--foil);color:var(--wine);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -12px rgba(227,182,73,.7)}
.spot:hover{filter:brightness(1.07)}
.spot.off{background:rgba(255,255,255,.03);color:var(--mute);border:1.5px dashed rgba(227,182,73,.55);box-shadow:none;cursor:default;filter:none}
.spot.off svg{opacity:.55}
.spot.off .dot{fill:#6b665e}
.ghost{border:1.5px solid var(--line);color:var(--ink)}
.ghost:hover{border-color:var(--gold)}
.btn:focus-visible,.mark:focus-visible{outline:2px solid var(--hi);outline-offset:3px;border-radius:999px}



@media (min-width:821px){
.top{display:flex;flex-direction:column}
.hero{flex:1;display:flex;align-items:center}
.hero .wrap{width:100%}
}
@media (max-width:820px){
.hero .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "panel";row-gap:22px}
.stage,.panel{max-width:580px}
}
@media (max-width:600px){
.nav .wrap{padding-block:8px}
.hero .wrap{padding-top:6px;row-gap:18px}
.unit{padding:12px 2px 10px}
.lab{margin-top:6px}
.actions{margin-top:18px;gap:10px}
}
@media (prefers-reduced-motion:reduce){.disc{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="top">
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<header class="band nav">
  <div class="wrap">
    <a class="mark" href="#"><img class="avatar" id="avatar" alt="" hidden><span class="foiltext">goldpiece</span></a>
  </div>
</header>

<main class="band hero">
  <div class="wrap">
    <div class="head">
      <h1 class="foiltext">Crevàusse</h1>
    </div>

    <div class="stage" role="img" aria-label="Crevàusse by goldpiece: a record sliding out of its sleeve">
      <div class="record">
        <div class="disc">
          <div class="label"><span class="l1">goldpiece</span><span class="hole"></span><span class="l2">Crevàusse</span><span class="l3">33⅓</span></div>
        </div>
        <div class="sheen"></div>
      </div>
      <div class="sleeve">
        <img id="cover" alt="" hidden>
        <div class="art" id="sleeveArt">
          <div>
            <p class="a1">goldpiece</p>
            <p class="a2 foiltext">Crevàusse</p>
          </div>
          <p class="a3">Dec 25, 2026</p>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="count" id="count" role="timer" aria-label="Time left until release">
        <div class="unit"><span class="num" id="cd-d">--</span><span class="lab" id="lb-d">days</span></div>
        <div class="unit"><span class="num" id="cd-h">--</span><span class="lab" id="lb-h">hours</span></div>
        <div class="unit"><span class="num" id="cd-m">--</span><span class="lab" id="lb-m">minutes</span></div>
        <div class="unit"><span class="num" id="cd-s">--</span><span class="lab" id="lb-s">seconds</span></div>
      </div>
      <p class="outnow foiltext" id="outnow" hidden>Out now</p>

      <div class="actions">
        <a class="btn spot off" id="spotify" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="dot" cx="12" cy="12" r="12" fill="#1ed760"/><path d="M5.9 9.2c4-1.2 8.6-.8 12.2 1.2M6.6 12.5c3.3-.9 7-.6 10 1.1M7.3 15.7c2.6-.7 5.4-.4 7.6.9" fill="none" stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="spotLabel">Coming Dec 25</span>
        </a>
        <a class="btn ghost" id="igBtn" href="https://www.instagram.com/goldpiece.24k/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>
          Follow on Instagram
        </a>
      </div>
    </div>
  </div>
</main>
</div>

<script>
{
  const $ = id => document.getElementById(id);
  const S = (typeof SITE === "object" && SITE) || {};
  const clean = u => String(u || "").trim();
  const isWeb = u => /^https:\/\/\S+$/i.test(u);

  // Release time: read as local time on the visitor's device.
  const p = (clean(S.release) || "2026-12-25T00:00").match(/\d+/g).map(Number);
  const releaseAt = new Date(p[0], p[1] - 1, p[2], p[3] || 0, p[4] || 0, p[5] || 0);

  // Mosaic background: fragments of the painting, only if the file loads.
  const bgFile = clean(S.background);
  if (bgFile) {
    const im = new Image();
    im.onload = () => {
      const box = $("backdrop");
      const grid = document.createElement("div");
      grid.className = "mosaic";
      grid.style.setProperty("--art", `url("${new URL(bgFile, location.href).href}")`);
      box.prepend(grid);
      let built = "";
      const build = () => {
        const W = box.clientWidth, H = box.clientHeight;
        const cell = W < 600 ? 64 : 92;
        const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell) + 1;
        if (cols + "x" + rows === built) return;
        built = cols + "x" + rows;
        let seed = 24;
        const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
        grid.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
        grid.style.gridAutoRows = cell + "px";
        const tiles = [];
        for (let i = 0; i < cols * rows; i++) {
          const r = rnd();
          const span = r < .12 ? [2, 2] : r < .3 ? [2, 1] : r < .45 ? [1, 2] : [1, 1];
          const coin = rnd() < .06;                       // zoomed in on the gold coins
          const size = Math.round(cell * (coin ? 9 : 3 + rnd() * 5));
          const x = coin ? 50.5 : rnd() * 100, y = coin ? 39 : rnd() * 100;
          const gold = coin || rnd() < .1;
          tiles.push(`<i class="tile${gold ? " gold" : ""}" style="grid-column:span ${span[0]};grid-row:span ${span[1]};background-size:auto ${size}px;background-position:${x.toFixed(1)}% ${y.toFixed(1)}%;opacity:${(.32 + rnd() * .38).toFixed(2)}"></i>`);
        }
        grid.innerHTML = tiles.join("");
      };
      build();
      const mosaicWatch = new ResizeObserver(build);
      mosaicWatch.observe(box);

      // Shards light up under the pointer or a tap, then dim back slowly.
      let lit = null, frame = 0, px = 0, py = 0;
      const fade = t => { if (t) t.classList.remove("lit"); };
      const under = () => {
        frame = 0;
        const t = document.elementsFromPoint(px, py).find(e => e.classList && e.classList.contains("tile")) || null;
        if (t === lit) return;
        fade(lit);
        lit = t;
        if (lit) lit.classList.add("lit");
      };
      addEventListener("pointermove", e => { px = e.clientX; py = e.clientY; if (!frame) frame = requestAnimationFrame(under); }, { passive: true });
      addEventListener("pointerdown", e => { px = e.clientX; py = e.clientY; under(); }, { passive: true });
      addEventListener("pointerup", e => { if (e.pointerType !== "mouse") setTimeout(() => { fade(lit); lit = null; }, 900); });
      document.documentElement.addEventListener("mouseleave", () => { fade(lit); lit = null; });

      // Now and then a random shard glows on its own (off when the device asks for less motion).
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const shimmer = setInterval(() => {
          const all = grid.children;
          if (document.hidden || !all.length) return;
          const t = all[Math.floor(Math.random() * all.length)];
          if (t === lit) return;
          t.classList.add("lit");
          setTimeout(() => { if (t !== lit) t.classList.remove("lit"); }, 2400);
        }, 1100);
      }
    };
    im.src = bgFile;
  }

  // Spotify: accept a web link or a spotify: URI.
  const toWeb = u => {
    const m = u.match(/^spotify:(track|album|playlist|artist):([A-Za-z0-9]+)$/);
    return m ? `https://open.spotify.com/${m[1]}/${m[2]}` : (isWeb(u) ? u : "");
  };
  const spotifyUrl = toWeb(clean(S.spotifyUrl));
  const presaveUrl = isWeb(clean(S.presaveUrl)) ? clean(S.presaveUrl) : "";
  const searchUrl = "https://open.spotify.com/search/" + encodeURIComponent("goldpiece Crevàusse");

  // Instagram links
  const ig = isWeb(clean(S.instagramUrl)) ? clean(S.instagramUrl) : "https://www.instagram.com/goldpiece.24k/";
  $("igBtn").href = ig;

  // Dates as text
  const shortDay = releaseAt.toLocaleDateString("en-US", { month: "short", day: "numeric" });

  // Cover art: shown only if the file loads.
  const coverFile = clean(S.coverArt);
  if (coverFile) {
    const img = $("cover");
    img.alt = "Crevàusse cover art: a cubist painting of a woman in red, with a man in a hat under a street lamp, a red moon and a martini glass";
    img.onload = () => { img.hidden = false; $("sleeveArt").hidden = true; };
    img.onerror = () => img.remove();
    img.src = coverFile;
  }

  // Profile picture: header avatar and tab icon, shown only if the file loads.
  const picFile = clean(S.profilePic);
  if (picFile) {
    const a = $("avatar");
    a.onload = () => {
      a.hidden = false;
      const icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.href = picFile;
    };
    a.onerror = () => a.remove();
    a.src = picFile;
  }

  function setMode(out) {
    $("count").hidden = out;
    $("outnow").hidden = !out;

    let href = "", label = "";
    if (spotifyUrl) { href = spotifyUrl; label = "Listen on Spotify"; }
    else if (out) { href = searchUrl; label = "Listen on Spotify"; }
    else if (presaveUrl) { href = presaveUrl; label = "Pre-save on Spotify"; }
    else { label = `Coming ${shortDay}`; }

    const b = $("spotify");
    if (href) { b.href = href; b.removeAttribute("aria-disabled"); b.classList.remove("off"); }
    else { b.removeAttribute("href"); b.setAttribute("aria-disabled", "true"); b.classList.add("off"); }
    $("spotLabel").textContent = label;
  }

  const units = [["d", 86400, "day"], ["h", 3600, "hour"], ["m", 60, "minute"], ["s", 1, "second"]];
  const shown = {};
  function tick(ms) {
    let left = Math.floor(ms / 1000);
    for (const [k, size, word] of units) {
      const v = Math.floor(left / size);
      left -= v * size;
      const str = String(v).padStart(2, "0");
      if (shown[k] !== str) {
        shown[k] = str;
        $("cd-" + k).innerHTML = [...str].map(c => `<i>${c}</i>`).join("");
        $("lb-" + k).textContent = v === 1 ? word : word + "s";
      }
    }
  }

  let mode = null;
  function render() {
    const ms = releaseAt.getTime() - Date.now();
    const out = location.hash === "#out-now" || ms <= 0;
    if (out !== mode) { mode = out; setMode(out); }
    if (!out) tick(ms);
  }
  render();
  const timer = setInterval(render, 250);
  addEventListener("hashchange", () => { mode = null; render(); });
}
</script>
</body>
</html>
